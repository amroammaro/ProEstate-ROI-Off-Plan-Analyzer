        if (type === "offplan") {
          setInputs({
            propertyName: lang === "ar" ? "شقة فندقية تحت الإنشاء (8 سنوات)" : "Off-Plan Serviced Apt (8 Yrs)",

            deliveryYear: 4,

            opexPct: 5,
            appreciationPct: 12,
            analysisHorizon: 15,
          });
          setSelectedYear(8);
        } else if (type === "commercial") {
          setInputs({
            propertyName: lang === "ar" ? "مكتب إداري بالعاصمة / التجمع" : "Grade-A Admin Office",
            totalPrice: 9500000,
            downPaymentPct: 15,
            installmentYears: 6,
            hasBullet: true,
            bulletAmount: 400000,
            bulletYears: 3,
            bulletIncluded: true,
            maintPct: 10,

            finishingCost: 600000,
            deliveryYear: 3,
            initialAnnualRent: 1100000,
            rentEscalation: 12,
            opexPct: 5,
            appreciationPct: 14,
            analysisHorizon: 12,
          });
          setSelectedYear(6);
        } else if (type === "ready") {
          setInputs({
            propertyName: lang === "ar" ? "عقار جاهز استلام فوري بالتقسيط" : "Ready To Move Property",
            totalPrice: 5000000,
            downPaymentPct: 25,
            installmentYears: 4,
            hasBullet: false,
            bulletAmount: 0,
            bulletYears: 0,
            bulletIncluded: true,
            maintPct: 5,
            maintYear: 1,
            finishingCost: 200000,
            deliveryYear: 1,
            initialAnnualRent: 500000,
            rentEscalation: 10,
            opexPct: 5,
            appreciationPct: 10,
            analysisHorizon: 10,
          });
          setSelectedYear(5);
        }
      };

      // --- Core Financial Modeling Engine ---
      const model = useMemo(() => {
        const price = Number(inputs.totalPrice) || 0;
        const dpPct = Number(inputs.downPaymentPct) || 0;
        const dpAmount = price * (dpPct / 100);
        const instYears = Math.max(1, Number(inputs.installmentYears) || 1);

        const hasBullet = Boolean(inputs.hasBullet);
        const bulletAmt = hasBullet ? (Number(inputs.bulletAmount) || 0) : 0;
        const bulletYrs = hasBullet ? Math.max(0, Number(inputs.bulletYears) || 0) : 0;
        const totalBullets = bulletAmt * bulletYrs;

        // Calculate regular annual installment
        let remainingForInstallments = price - dpAmount;
        if (hasBullet && inputs.bulletIncluded) {
          remainingForInstallments = Math.max(0, remainingForInstallments - totalBullets);
        }
        const regularAnnualInstallment = remainingForInstallments / instYears;

        const maintDeposit = price * ((Number(inputs.maintPct) || 0) / 100);
        const maintYear = Math.max(1, Number(inputs.maintYear) || 1);
        const finishing = Number(inputs.finishingCost) || 0;
        const deliveryYr = Math.max(1, Number(inputs.deliveryYear) || 1);

        const baseRent = Number(inputs.initialAnnualRent) || 0;
        const rentEsc = (Number(inputs.rentEscalation) || 0) / 100;
        const opexRate = (Number(inputs.opexPct) || 0) / 100;
        const apprRate = (Number(inputs.appreciationPct) || 0) / 100;
        const horizon = Math.max(1, Math.min(30, Number(inputs.analysisHorizon) || 15));

        const rows = [];
        let cumulativeOutflow = 0;
        let cumulativeNetRent = 0;
        let cumulativeNetCashFlow = 0;
        let cumulativeInstallmentsAndDP = 0;

        let opBreakevenYear = null;
        let fullPaybackYear = null;
        let exactPaybackYears = null;

        for (let y = 1; y <= horizon; y++) {
          const dpThisYear = y === 1 ? dpAmount : 0;
          const regInstThisYear = y <= instYears ? regularAnnualInstallment : 0;
          const bulletThisYear = (hasBullet && y <= bulletYrs) ? bulletAmt : 0;
          const maintThisYear = y === maintYear ? maintDeposit : 0;
          const finishThisYear = y === deliveryYr ? finishing : 0;

          const annualOutflow = dpThisYear + regInstThisYear + bulletThisYear + maintThisYear + finishThisYear;
          cumulativeOutflow += annualOutflow;
          cumulativeInstallmentsAndDP += (dpThisYear + regInstThisYear + bulletThisYear);

          // Rental Income starts at deliveryYear
          let grossRent = 0;
          if (y >= deliveryYr) {
            const rentYearsElapsed = y - deliveryYr;
            grossRent = baseRent * Math.pow(1 + rentEsc, rentYearsElapsed);
          }
          const opex = grossRent * opexRate;
          const netRentNOI = grossRent - opex;
          cumulativeNetRent += netRentNOI;

          const netCashFlow = netRentNOI - annualOutflow;
          const prevCumCF = cumulativeNetCashFlow;
          cumulativeNetCashFlow += netCashFlow;

          // Break-even checks
          if (opBreakevenYear === null && y >= deliveryYr && netCashFlow >= 0) {
            opBreakevenYear = y;
          }
          if (fullPaybackYear === null && cumulativeNetRent >= cumulativeOutflow && cumulativeOutflow > 0) {
            fullPaybackYear = y;
            const unrecoveredBeforeThisYear = cumulativeOutflow - (cumulativeNetRent - netRentNOI);
            const fraction = netRentNOI > 0 ? Math.max(0, Math.min(1, unrecoveredBeforeThisYear / netRentNOI)) : 0;
            exactPaybackYears = (y - 1 + fraction).toFixed(1);
          }

          // Property Market Value at end of year y
          const marketValue = price * Math.pow(1 + apprRate, y);
          const prevMarketValue = price * Math.pow(1 + apprRate, y - 1);
          const annualAppreciationGain = marketValue - prevMarketValue;
          const cumulativeAppreciation = marketValue - price;

          // Remaining Developer Debt
          const totalDeveloperPrice = price + (hasBullet && !inputs.bulletIncluded ? totalBullets : 0);
          const remainingDebt = Math.max(0, totalDeveloperPrice - cumulativeInstallmentsAndDP);

          // Core Metrics
          // 1. Equity Paid = cumulativeOutflow
          const equityPaid = cumulativeOutflow;

          // 2. Net Equity Invested = Equity Paid - Cumulative Net Rent (Unrecovered Equity from pocket)
          const netEquityInvested = Math.max(0, equityPaid - cumulativeNetRent);

          // Book Owner's Equity in Property = Market Value - Remaining Developer Debt
          const ownerMarketEquity = Math.max(1, marketValue - remainingDebt);

          // 3. Cash on Cash Return (CoC) = Annual Net Cash Flow / Equity Paid (or NOI / Equity Paid)
          // Standard investor CoC = Annual Net Cash Flow / Equity Paid
          const cashOnCash = equityPaid > 0 ? (netCashFlow / equityPaid) * 100 : 0;
          const operatingCoC = equityPaid > 0 ? (netRentNOI / equityPaid) * 100 : 0;

          // 4. Total ROI = (Cumulative Net Rent + Cumulative Appreciation - Maint - Finishing) / Equity Paid
          const totalGain = cumulativeNetRent + cumulativeAppreciation - (y >= maintYear ? maintDeposit : 0) - (y >= deliveryYr ? finishing : 0);
          const roi = equityPaid > 0 ? (totalGain / equityPaid) * 100 : 0;

          // 5. ROE (Return on Equity) = (Annual NOI + Annual Appreciation) / Owner's Market Equity
          const roe = ownerMarketEquity > 0 ? ((netRentNOI + annualAppreciationGain) / ownerMarketEquity) * 100 : 0;

          // 6. ROA (Return on Assets) = Annual NOI / Property Market Value
          const roa = marketValue > 0 ? (netRentNOI / marketValue) * 100 : 0;

          // 7. Capital Recovery Rate % = Cumulative Net Rent / Equity Paid
          const capitalRecoveryRate = equityPaid > 0 ? (cumulativeNetRent / equityPaid) * 100 : 0;

          let status = "construction";
          if (y === deliveryYr) status = "handover";
          else if (y > deliveryYr) status = "rented";

          rows.push({
            year: y,
            status,
            dpThisYear,
            regInstThisYear,
            bulletThisYear,
            maintThisYear,
            finishThisYear,
            annualOutflow,
            grossRent,
            opex,
            netRentNOI,
            netCashFlow,
            cumulativeNetCashFlow,
            equityPaid,
            netEquityInvested,
            marketValue,
            ownerMarketEquity,
            remainingDebt,
            cashOnCash,
            operatingCoC,
            roi,
            roe,
            roa,
            capitalRecoveryRate
          });
        }

        const safeSelectedYear = Math.min(horizon, Math.max(1, selectedYear));
        const currentYearData = rows[safeSelectedYear - 1] || rows[rows.length - 1];
        const finalYearData = rows[rows.length - 1];

        return {
          dpAmount,
          regularAnnualInstallment,
          maintDeposit,
          rows,
          currentYearData,
          finalYearData,
          opBreakevenYear,
          fullPaybackYear,
          exactPaybackYears,
          safeSelectedYear
        };

                  <span>{t.yearWord} 1</span>
                  <span>{t.statusHandover} ({t.yearWord} {inputs.deliveryYear})</span>
                  <span>{t.yearWord} {inputs.analysisHorizon}</span>
                </div>
              </div>

              {/* TAB: DASHBOARD & CHARTS */}
              <div className={`${activeTab === "dashboard" || activeTab === "inputs" ? "block" : "hidden lg:block"} space-y-6`}>
                
                {/* 8 Core KPI Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                  {/* 1. Equity Paid */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div className="text-[11px] font-bold text-slate-500 mb-1">{t.kpiEquityPaid}</div>
                    <div className="text-base md:text-lg font-extrabold text-slate-900">
                      {fmtNum(model.currentYearData.equityPaid)} <span className="text-xs font-normal">{t.currency}</span>
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 leading-tight">{t.kpiEquityPaidSub}</div>
                  </div>

                  {/* 2. Net Equity Invested */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div className="text-[11px] font-bold text-slate-500 mb-1">{t.kpiNetEquity}</div>
                    <div className="text-base md:text-lg font-extrabold text-indigo-700">
                      {fmtNum(model.currentYearData.netEquityInvested)} <span className="text-xs font-normal">{t.currency}</span>
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 leading-tight">{t.kpiNetEquitySub}</div>
                  </div>

                  {/* 3. Net Cash Flow */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div className="text-[11px] font-bold text-slate-500 mb-1">{t.kpiNetCashFlow}</div>
                    <div className={`text-base md:text-lg font-extrabold ${model.currentYearData.netCashFlow >= 0 ? "text-emerald-600" : "text-rose-600"}`}>
                      {fmtNum(model.currentYearData.netCashFlow)} <span className="text-xs font-normal">{t.currency}</span>
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 leading-tight">{t.kpiNetCashFlowSub}</div>
                  </div>

                  {/* 4. Cash on Cash */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div className="text-[11px] font-bold text-slate-500 mb-1">{t.kpiCoC}</div>
                    <div className={`text-base md:text-lg font-extrabold ${model.currentYearData.cashOnCash >= 0 ? "text-emerald-600" : "text-amber-600"}`}>
                      {fmtPct(model.currentYearData.cashOnCash)}
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 leading-tight">{t.kpiCoCSub}</div>
                  </div>

                  {/* 5. Total ROI */}
                  <div className="bg-gradient-to-br from-indigo-950 to-slate-900 text-white p-4 rounded-2xl shadow-sm">
                    <div className="text-[11px] font-bold text-indigo-200 mb-1">{t.kpiROI}</div>
                    <div className="text-lg md:text-xl font-extrabold text-emerald-400">
                      {fmtPct(model.currentYearData.roi)}
                    </div>
                    <div className="text-[10px] text-slate-300 mt-1 leading-tight">{t.kpiROISub}</div>
                  </div>

                  {/* 6. ROE */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div className="text-[11px] font-bold text-slate-500 mb-1">{t.kpiROE}</div>
                    <div className="text-base md:text-lg font-extrabold text-indigo-600">
                      {fmtPct(model.currentYearData.roe)}
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 leading-tight">{t.kpiROESub}</div>
                  </div>

                  {/* 7. ROA */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div className="text-[11px] font-bold text-slate-500 mb-1">{t.kpiROA}</div>
                    <div className="text-base md:text-lg font-extrabold text-teal-600">
                      {fmtPct(model.currentYearData.roa)}
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 leading-tight">{t.kpiROASub}</div>
                  </div>

                  {/* 8. Capital Recovery Rate */}
                  <div className="bg-white p-4 rounded-2xl border border-slate-200/80 shadow-sm">
                    <div className="text-[11px] font-bold text-slate-500 mb-1">{t.kpiCapRecovery}</div>
                    <div className="text-base md:text-lg font-extrabold text-emerald-700">
                      {fmtPct(model.currentYearData.capitalRecoveryRate)}
                    </div>
                    <div className="text-[10px] text-slate-400 mt-1 leading-tight">{t.kpiCapRecoverySub}</div>
                  </div>
                </div>

                {/* Break-Even & Capital Recovery Banner */}
                <div className="bg-gradient-to-r from-emerald-900 via-teal-900 to-slate-900 text-white rounded-2xl p-5 shadow-md print-break-inside-avoid">
                  <div className="flex items-center gap-2 mb-4">
                    <Icon name="clock" className="w-5 h-5 text-emerald-400" />
                    <h3 className="font-extrabold text-sm md:text-base">{t.breakevenTitle}</h3>
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div className="bg-white/10 backdrop-blur-sm rounded-xl p-3.5 border border-white/15">
                      <div className="text-xs text-emerald-200 font-bold">{t.opBreakeven}</div>
                      <div className="text-xl font-black text-white mt-1">
                        {model.opBreakevenYear ? `${t.yearWord} ${model.opBreakevenYear}` : t.notReached}
                      </div>
                      <div className="text-[11px] text-slate-300 mt-1">{t.opBreakevenDesc}</div>
                    </div>

                    <div className="bg-white/10 backdrop-blur-sm rounded-xl p-3.5 border border-white/15">
                      <div className="text-xs text-amber-200 font-bold">{t.fullPayback}</div>
                      <div className="text-xl font-black text-white mt-1">
                        {model.exactPaybackYears ? `${model.exactPaybackYears} ${t.yearUnit} (${t.yearWord} ${model.fullPaybackYear})` : t.notReached}
                      </div>
                      <div className="text-[11px] text-slate-300 mt-1">{t.fullPaybackDesc}</div>
                    </div>
                  </div>
                </div>

                {/* Interactive SVG Chart 1: Annual & Cumulative Cash Flow */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 print-break-inside-avoid">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <h3 className="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">
                      <Icon name="chart" className="w-5 h-5 text-indigo-600" />
                      <span>{t.chartCashFlowTitle}</span>
                    </h3>
                    <div className="flex items-center gap-4 text-xs font-semibold">
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-sm bg-emerald-500 inline-block"></span>
                        {t.legendNetCF} (+)
                      </span>
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-sm bg-rose-500 inline-block"></span>
                        {t.legendNetCF} (-)
                      </span>
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-1 bg-indigo-600 inline-block"></span>
                        {t.legendCumCF}
                      </span>
                    </div>
                  </div>

                  <div className="w-full overflow-x-auto">
                    <svg viewBox="0 0 720 250" className="w-full h-56 min-w-[500px]">
                      {/* Zero Baseline */}
                      <line x1="40" y1="125" x2="700" y2="125" stroke="#94a3b8" strokeWidth="1" strokeDasharray="4 4" />
                      
                      {model.rows.map((r, idx) => {
                        const count = model.rows.length;
                        const colWidth = 640 / count;
                        const xCenter = 50 + idx * colWidth + colWidth / 2;
                        const barWidth = Math.min(26, colWidth * 0.55);

                        const barHeight = (Math.abs(r.netCashFlow) / maxAbsCF) * 95;
                        const barY = r.netCashFlow >= 0 ? 125 - barHeight : 125;

                        return (
                          <g key={r.year} onClick={() => setSelectedYear(r.year)} className="cursor-pointer group">
                            <rect
                              x={xCenter - barWidth / 2}
                              y={barY}
                              width={barWidth}
                              height={Math.max(2, barHeight)}
                              rx="3"
                              fill={r.netCashFlow >= 0 ? "#10b981" : "#f43f5e"}
                              opacity={r.year === model.safeSelectedYear ? "1" : "0.75"}
                            />
                            <text
                              x={xCenter}
                              y="238"
                              textAnchor="middle"
                              fontSize="10"
                              fontWeight={r.year === model.safeSelectedYear ? "800" : "500"}
                              fill={r.year === model.safeSelectedYear ? "#4f46e5" : "#64748b"}
                            >
                              Y{r.year}
                            </text>
                          </g>
                        );
                      })}

                      {/* Cumulative Cash Flow Polyline */}
                      <polyline
                        fill="none"
                        stroke="#4f46e5"
                        strokeWidth="2.5"
                        points={model.rows
                          .map((r, idx) => {
                            const count = model.rows.length;
                            const colWidth = 640 / count;
                            const xCenter = 50 + idx * colWidth + colWidth / 2;
                            const yPos = 125 - (r.cumulativeNetCashFlow / maxAbsCF) * 95;
                            return `${xCenter},${yPos}`;
                          })
                          .join(" ")}
                      />

                      {model.rows.map((r, idx) => {
                        const count = model.rows.length;
                        const colWidth = 640 / count;
                        const xCenter = 50 + idx * colWidth + colWidth / 2;
                        const yPos = 125 - (r.cumulativeNetCashFlow / maxAbsCF) * 95;
                        return (
                          <circle
                            key={`pt-${r.year}`}
                            cx={xCenter}
                            cy={yPos}
                            r={r.year === model.safeSelectedYear ? "5" : "3"}
                            fill="#4f46e5"
                            stroke="#ffffff"
                            strokeWidth="1.5"
                          />
                        );
                      })}
                    </svg>
                  </div>
                </div>

                {/* Interactive SVG Chart 2: Equity Paid vs Net Equity vs Property Value */}
                <div className="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 print-break-inside-avoid">
                  <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
                    <h3 className="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">
                      <Icon name="trendingUp" className="w-5 h-5 text-emerald-600" />
                      <span>{t.chartEquityTitle}</span>
                    </h3>
                    <div className="flex items-center gap-4 text-xs font-semibold">
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-sm bg-slate-700 inline-block"></span>
                        {t.legendEquityPaid}
                      </span>
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-3 rounded-sm bg-amber-500 inline-block"></span>
                        {t.legendNetEquity}
                      </span>
                      <span className="flex items-center gap-1.5">
                        <span className="w-3 h-1 bg-emerald-600 inline-block"></span>
                        {t.legendPropVal}
                      </span>
                    </div>
                  </div>

                  <div className="w-full overflow-x-auto">
                    <svg viewBox="0 0 720 230" className="w-full h-52 min-w-[500px]">
                      <line x1="40" y1="200" x2="700" y2="200" stroke="#cbd5e1" strokeWidth="1" />
                      {model.rows.map((r, idx) => {
                        const count = model.rows.length;
                        const colWidth = 640 / count;
                        const xCenter = 50 + idx * colWidth + colWidth / 2;
                        const bw = Math.min(14, colWidth * 0.32);

                        const eqH = (r.equityPaid / maxValChart2) * 170;
                        const netEqH = (r.netEquityInvested / maxValChart2) * 170;

                        return (
                          <g key={`eq-${r.year}`} onClick={() => setSelectedYear(r.year)} className="cursor-pointer">
                            <rect
                              x={xCenter - bw - 1}
                              y={200 - eqH}
                              width={bw}
                              height={Math.max(2, eqH)}
                              rx="2"
                              fill="#334155"
                            />
                            <rect
                              x={xCenter + 1}
                              y={200 - netEqH}
                              width={bw}
                              height={Math.max(2, netEqH)}
                              rx="2"
                              fill="#f59e0b"
                            />
                            <text
                              x={xCenter}
                              y="218"
                              textAnchor="middle"
                              fontSize="10"
                              fill="#64748b"
                            >
                              Y{r.year}
                            </text>
                          </g>
                        );
                      })}

                      {/* Market Value Line */}
                      <polyline
                        fill="none"
                        stroke="#059669"
                        strokeWidth="2.5"
                        points={model.rows
                          .map((r, idx) => {
                            const count = model.rows.length;
                            const colWidth = 640 / count;
                            const xCenter = 50 + idx * colWidth + colWidth / 2;
                            const yPos = 200 - (r.marketValue / maxValChart2) * 170;
                            return `${xCenter},${yPos}`;
                          })
                          .join(" ")}
                      />
                    </svg>
                  </div>
                </div>
              </div>

              {/* TAB: FULL SCHEDULE TABLE */}
              <div className={`${activeTab === "schedule" ? "block" : "hidden lg:block"} bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden`}>
                <div className="p-4 md:p-5 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="font-bold text-slate-800 text-sm md:text-base flex items-center gap-2">
                    <Icon name="table" className="w-5 h-5 text-indigo-600" />
                    <span>{t.navSchedule} ({inputs.analysisHorizon} {t.yearUnit})</span>
                  </h3>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-xs text-start border-collapse">
                    <thead>
                      <tr className="bg-slate-900 text-slate-100 font-bold">
                        <th className="py-3 px-3 text-start">{t.tableYear}</th>
                        <th className="py-3 px-3 text-start">{t.tableStatus}</th>
                        <th className="py-3 px-3 text-end">{t.tableOutflow}</th>
                        <th className="py-3 px-3 text-end">{t.tableRent}</th>
                        <th className="py-3 px-3 text-end">{t.tableNetCF}</th>
                        <th className="py-3 px-3 text-end">{t.tableEquityPaid}</th>
                        <th className="py-3 px-3 text-end">{t.tableNetEquity}</th>
                        <th className="py-3 px-3 text-end">{t.tableCoC}</th>
                        <th className="py-3 px-3 text-end">{t.tableROI}</th>
                        <th className="py-3 px-3 text-end">{t.tableROE}</th>
                        <th className="py-3 px-3 text-end">{t.tableROA}</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {model.rows.map((r) => {
                        const isSelected = r.year === model.safeSelectedYear;
                        return (
                          <tr
                            key={r.year}
                            onClick={() => setSelectedYear(r.year)}
                            className={`cursor-pointer transition ${
                              isSelected ? "bg-indigo-50/90 font-bold" : "hover:bg-slate-50"
                            }`}
                          >
                            <td className="py-2.5 px-3 font-extrabold text-indigo-950">Y{r.year}</td>
                            <td className="py-2.5 px-3 whitespace-nowrap">
                              <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold ${
                                r.status === "construction"
                                  ? "bg-amber-100 text-amber-800"
                                  : r.status === "handover"
                                  ? "bg-blue-100 text-blue-800"
                                  : "bg-emerald-100 text-emerald-800"
                              }`}>
                                {r.status === "construction" ? t.statusConstruction : r.status === "handover" ? t.statusHandover : t.statusRented}
                              </span>
                            </td>
                            <td className="py-2.5 px-3 text-end text-rose-600">{fmtNum(r.annualOutflow)}</td>
                            <td className="py-2.5 px-3 text-end text-emerald-600">{fmtNum(r.netRentNOI)}</td>
                            <td className={`py-2.5 px-3 text-end font-bold ${r.netCashFlow >= 0 ? "text-emerald-700" : "text-rose-700"}`}>
                              {fmtNum(r.netCashFlow)}
                            </td>
                            <td className="py-2.5 px-3 text-end text-slate-800">{fmtNum(r.equityPaid)}</td>
                            <td className="py-2.5 px-3 text-end text-indigo-700">{fmtNum(r.netEquityInvested)}</td>
                            <td className="py-2.5 px-3 text-end">{fmtPct(r.cashOnCash)}</td>
                            <td className="py-2.5 px-3 text-end font-bold text-indigo-700">{fmtPct(r.roi)}</td>
                            <td className="py-2.5 px-3 text-end">{fmtPct(r.roe)}</td>
                            <td className="py-2.5 px-3 text-end">{fmtPct(r.roa)}</td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>

            </section>
          </main>

          {/* Mobile Bottom Navigation Bar */}
          <nav className="lg:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 shadow-xl z-40 grid grid-cols-3 py-2 no-print">
            <button
              onClick={() => setActiveTab("inputs")}
              className={`flex flex-col items-center justify-center py-1 text-xs font-bold ${
                activeTab === "inputs" ? "text-indigo-600" : "text-slate-500"
              }`}
            >
              <Icon name="sliders" className="w-5 h-5 mb-0.5" />
              <span>{t.navInputs}</span>
            </button>
            <button
              onClick={() => setActiveTab("dashboard")}
              className={`flex flex-col items-center justify-center py-1 text-xs font-bold ${
                activeTab === "dashboard" ? "text-indigo-600" : "text-slate-500"
              }`}
            >
              <Icon name="chart" className="w-5 h-5 mb-0.5" />
              <span>{t.navDashboard}</span>
            </button>
            <button
              onClick={() => setActiveTab("schedule")}
              className={`flex flex-col items-center justify-center py-1 text-xs font-bold ${
                activeTab === "schedule" ? "text-indigo-600" : "text-slate-500"
              }`}
            >
              <Icon name="table" className="w-5 h-5 mb-0.5" />
              <span>{t.navSchedule}</span>
            </button>
          </nav>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
